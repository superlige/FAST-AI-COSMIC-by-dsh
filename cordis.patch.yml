# fast-ai-cosmic 组合包：给桌面和网页界面声明两个预设（新建会话时选的模式），会话里不切换。
#
#   - cosmic       苍穹开发：产品工具 mode=dev，带终端、后台任务；
#   - cosmic-prod  生产排障：产品工具 mode=prod，不挂终端和后台任务（生产只读靠工具层，终端能绕过去），
#                  写工程文件由产品工具的执行前门槛拒（`.cosmic-ai/` 下放行）。
#
# 产品工具挂在预设里面，不挂在顶层：挂在顶层的工具每个会话都看得到，排障会话就会看到编译、真跑业务。
# 两个预设挂的 dsh 插件和无界面配置（scripts/setup-dsh-profiles.mjs）开着的那一套对齐，
# 命令行跑过的验收在界面里也成立。预设里的插件不继承 dsh-base 顶层行的配置，同名行的配置要原样抄进来，
# 漏了必填项界面新建会话就失败；test/dsh/presets.test.ts 逐项对。子代理、计划模式、目标、联网、代码模式不挂。
#
# 无界面配置没有预设注册表，下面这些行在那里不起作用；产品工具由那边的配置自己插在顶层。
- id: agent-preset-registry
  config:
    default: cosmic
# 默认模型：和 pi 版一样用 codex（ChatGPT 账号登录：设置 → 模型里 codex 卡片上的「登录 ChatGPT」，或会话里 /cosmic-login）。
# 用户在设置里改的写在配置自己的那一层，盖过这里。无界面配置也套这一层（组合包在它的 bundles 里）。
- id: llm-pi-ai
  config:
    providers:
      openai-codex:
        # codex 默认走 WebSocket 并把连接缓存 5 分钟，无界面一次一问答完了进程还要空等它超时才退出；SSE 没有这条缓存
        transport: sse
        # models 整体替换 pi-ai 自带的 codex 清单：前 9 个是自带的（其余字段从自带清单取），
        # gpt-6.2-sol 是 dsh 用的 pi-ai 1.3.0 还没收的，字段照自带的 GPT-6.1 Sol 写。
        # 自带清单收了 gpt-6.2-sol、或多了这里没列的模型，test/dsh/model-config.test.ts 失败，回来改这里。
        models:
          - id: gpt-5.3-codex-spark
          - id: gpt-5.5
          - id: gpt-5.6-luna
          - id: gpt-5.6-sol
          - id: gpt-5.6-terra
          - id: gpt-6-astra
          - id: gpt-6-luna
          - id: gpt-6-sol
          - id: gpt-6.1-sol
          - id: gpt-6.2-sol
            name: GPT-6.2 Sol
            contextWindow: 500000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
      # Command Code 的 GOAT 网关（OpenAI 兼容接口）。密钥不进仓库和安装包：用的人在设置 → 模型的这张卡片上填，
      # 存进本机凭据，引用名 COMMANDCODE_GOAT_API_KEY。
      commandcode-goat:
        displayName: Command Code GOAT
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        apiKeyEnv: COMMANDCODE_GOAT_API_KEY
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: deepseek
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (Command Code GOAT)
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: z-ai/glm-5.3-flashx
            name: GLM-5.3 FlashX (Command Code GOAT)
            contextWindow: 1000000
            maxTokens: 131072
            input: [text]
            reasoningEfforts:
              low: low
              high: high
              max: max
- id: agent-default-model
  config:
    provider: openai-codex
    model: gpt-6.1-sol
    reasoningEffort: high
# dsh 自带的四个预设关掉，模式选择器里只剩这两个
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
# 品牌：dsh 官方品牌行换成我们的（画界面的事在 client/brand.js）
- id: ui-brand-official
  disabled: true
# DeepSeek 账号登录不用：左下角账号菜单、设置里的账号页、账号通知、模型页的「登录 DeepSeek」、按账号计费的模型线路。
# 左下角空出来，dsh 自己补一个普通的「设置」按钮。后台账号插件 deepseek-account 不能关：桌面版每次启动都经它
# 读一次登录状态，读不到就进不了主界面；它读的是本应用自己的凭据文件，永远是没登录。test/dsh/patch-targets.test.ts 拦。
- id: ui-settings-account
  disabled: true
- id: ui-account-notifications
  disabled: true
- id: llm-deepseek-account
  disabled: true
# 往 DeepSeek 发数据的三处：桌面使用数据两行、点反馈时发会话记录一行
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
- id: session-telemetry-otel
  disabled: true
- insert:
    - id: cosmic-brand
      name: fast-ai-cosmic
    - id: preset-cosmic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cosmic
        name: 苍穹开发
        description: 改插件、编译、真跑业务验证、写元数据（写之前弹确认单）
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: cosmic-tools
            name: fast-ai-cosmic/tools
            config:
              mode: dev
    - id: preset-cosmic-prod
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cosmic-prod
        name: 生产排障
        description: 只读查生产数据、元数据和 monitor 日志，出诊断报告；不编译、不跑业务、不改工程文件
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: cosmic-tools
            name: fast-ai-cosmic/tools
            config:
              mode: prod
